apiVersion: v1
kind: Pod
metadata:
  labels:
    app: php-app
  name: nginx-phpfpm
spec:
  containers:
  - image: php:7.2-fpm-alpine
    name: php-fpm-container
    volumeMounts:
    - mountPath: /var/www/html
      name: shared-files
  
  - image: nginx:latest
    name: nginx-container
    volumeMounts:
    - mountPath: /var/www/html
      name: shared-files
    - mountPath: /etc/nginx/nginx.conf
      name: nginx-config-volume
      subPath: nginx.conf

  volumes:
  - name: shared-files
    emptyDir: {}

  - name: nginx-config-volume
    configMap:
      name: nginx-config
